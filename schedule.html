<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HER - メッセージ予約管理</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --card-inner: #24283b;
            --primary: #5865f2;
            --text-main: #ffffff;
            --text-sub: #949ba4;
            --border-color: #2b2f48;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            font-weight: bold;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        select, textarea, input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-inner);
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 0.95rem;
        }

        button:hover {
            background: #4752c4;
        }

        .schedule-item {
            background: var(--card-inner);
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">📅 メッセージ予約管理</div>
        
        <div class="card">
            <div class="card-title">📝 新規予約作成</div>
            <form id="scheduleForm">
                <label for="channelSelect">送信先チャンネル</label>
                <select id="channelSelect" required>
                    <option value="">読み込み中...</option>
                </select>

                <label for="messageContent">送信メッセージ</label>
                <textarea id="messageContent" rows="4" placeholder="送信する内容を入力..." required></textarea>

                <label for="scheduledTime">送信日時</label>
                <input type="datetime-local" id="scheduledTime" required>

                <button type="submit">予約を追加する</button>
            </form>
        </div>

        <div class="card">
            <div class="card-title">📋 予約済みリスト</div>
            <div id="scheduleListContainer">読み込み中...</div>
        </div>
    </div>

    <script>
        async function loadChannels() {
            try {
                const res = await fetch('/api/channels');
                const data = await res.json();
                const select = document.getElementById('channelSelect');
                select.innerHTML = '';
                if (data.channels && data.channels.length > 0) {
                    data.channels.forEach(ch => {
                        const opt = document.createElement('option');
                        opt.value = ch.id;
                        opt.textContent = `# ${ch.name}`;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">チャンネルが見つかりません</option>';
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadSchedules() {
            try {
                const res = await fetch('/api/schedule/list');
                const data = await res.json();
                const container = document.getElementById('scheduleListContainer');
                if (data.schedules && data.schedules.length > 0) {
                    container.innerHTML = data.schedules.map(item => `
                        <div class="schedule-item">
                            <p style="margin: 0 0 6px 0; font-size: 0.85rem; color: #949ba4;"><b>予定時刻:</b> ${item.time} ${item.sent ? '✅(送信済)' : '⏳(待機中)'}</p>
                            <p style="margin: 0; white-space: pre-wrap;">${item.message}</p>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="color: #949ba4; font-size: 0.85rem;">予約はありません。</p>';
                }
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                channel_id: document.getElementById('channelSelect').value,
                message: document.getElementById('messageContent').value,
                scheduled_time: document.getElementById('scheduledTime').value
            };
            const res = await fetch('/api/schedule/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('✅ 予約が完了しました！');
                document.getElementById('messageContent').value = '';
                loadSchedules();
            } else {
                alert('❌ 予約に失敗しました。');
            }
        });

        loadChannels();
        loadSchedules();
    </script>
</body>
</html>

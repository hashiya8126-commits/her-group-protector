<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HER Group Protector</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --card-hover: #23273e;
            --accent-color: #5865f2;
            --text-main: #ffffff;
            --text-sub: #949ba4;
            --border-color: #2b2f48;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select, button, input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #121420;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .clickable-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clickable-card:active {
            background-color: var(--card-hover);
        }

        .card-info h3 {
            margin: 0 0 6px 0;
            font-size: 1rem;
        }

        .card-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .arrow {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        /* --- モーダル (設定ポップアップ) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
            width: auto;
            padding: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .save-btn {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛡️ HER Group Protector</h1>
    </div>

    <div class="card">
        <div class="section-title">🌐 管理するサーバーを選択</div>
        <select id="server-select">
            <!-- SERVER_OPTIONS -->
        </select>
        <div style="margin-top: 10px; font-size: 0.85rem; color: #43b581;">
            🟢 Botオンライン (HER Group Protector BOT)
        </div>
    </div>

    <div class="section-title">⚙️ 設定メニュー</div>

    <!-- タップでモーダルが開くエリア -->
    <div class="clickable-card" id="open-welcome-modal">
        <div class="card-info">
            <h3>📫 ようこそメッセージ & ログ設定</h3>
            <p>新規参加者の歓迎メッセージや各種ログチャンネルの設定</p>
        </div>
        <div class="arrow">➔</div>
    </div>
</div>

<!-- ⚙️ 設定用モーダル（ポップアップ画面） -->
<div class="modal-overlay" id="welcome-modal">
    <div class="modal">
        <div class="modal-header">
            <h2>📫 ようこそ＆ログ設定</h2>
            <button class="close-btn" id="close-modal">&times;</button>
        </div>

        <div class="form-group">
            <label>💬 ようこそメッセージ本文</label>
            <textarea id="welcome-msg" rows="3" placeholder="ようこそ {user} さん！"></textarea>
        </div>

        <div class="form-group">
            <label>📜 編集・削除ログチャンネル</label>
            <input type="text" placeholder="チャンネルIDを入力">
        </div>

        <div class="form-group">
            <label>🚨 NGワード警報チャンネル</label>
            <input type="text" placeholder="チャンネルIDを入力">
        </div>

        <div class="form-group">
            <label>🤪 迷言通知チャンネル</label>
            <input type="text" placeholder="チャンネルIDを入力">
        </div>

        <button class="save-btn" id="save-settings">設定を保存する</button>
    </div>
</div>

<script>
    const modal = document.getElementById('welcome-modal');
    const openBtn = document.getElementById('open-welcome-modal');
    const closeBtn = document.getElementById('close-modal');
    const saveBtn = document.getElementById('save-settings');

    // モーダルを開く
    openBtn.addEventListener('click', () => {
        modal.style.display = 'flex';
    });

    // モーダルを閉じる
    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    // 背景タップで閉じる
    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });

    // 保存ボタン
    saveBtn.addEventListener('click', () => {
        alert('設定を保存しました！');
        modal.style.display = 'none';
    });
</script>

</body>
</html>

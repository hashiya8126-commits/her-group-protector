<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HER Group Protector</title>
    <style>
        :root, [data-theme="navy"] {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --card-inner: #24283b;
            --primary: #5865f2;
            --text-main: #ffffff;
            --text-sub: #949ba4;
            --border-color: #2b2f48;
            --accent-green: #2ecc71;
        }

        [data-theme="black"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --card-inner: #1e1e1e;
            --primary: #5865f2;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --border-color: #2c2c2c;
            --accent-green: #2ecc71;
        }

        [data-theme="white"] {
            --bg-color: #f5f6f8;
            --card-bg: #ffffff;
            --card-inner: #f0f2f5;
            --primary: #5865f2;
            --text-main: #111827;
            --text-sub: #6b7280;
            --border-color: #e5e7eb;
            --accent-green: #10b981;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        select, button, input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-inner);
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .status-badge {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--accent-green);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .save-btn {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .setting-label {
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .status-item {
            background: var(--card-inner);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .status-value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        🛡️ HER Group Protector
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('home')">🏠 ホーム</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ 設定</button>
        <button class="tab-btn" onclick="switchTab('logs')">📜 実行履歴</button>
    </div>

    <!-- 個人設定 -->
    <div class="card">
        <div class="card-title">👤 個人設定 (表示スタイル)</div>
        <div class="setting-row">
            <span class="setting-label">🎨 カラーテーマ</span>
            <select id="user-theme-select" style="width: auto; padding: 6px 12px;" onchange="changeTheme(this.value)">
                <option value="navy">標準 (ダークネイビー)</option>
                <option value="black">真っ黒 (ピュアブラック)</option>
                <option value="white">真っ白 (ライトモード)</option>
            </select>
        </div>
    </div>

    <!-- サーバー選択 -->
    <div class="card">
        <div class="card-title">🌐 管理するサーバーを選択</div>
        <select id="server-select" onchange="loadGuildChannels()">
            <!-- SERVER_OPTIONS -->
        </select>
        <div class="status-badge" id="bot-status-text">
            🟢 Botオンライン (HER Group Protector BOT)
        </div>
    </div>

    <!-- 🏠 ホーム タブ -->
    <div id="tab-home" class="page-section active">
        <div class="card">
            <div class="card-title">📊 システムステータス</div>
            <div class="status-grid">
                <div class="status-item">
                    <div style="font-size:0.75rem; color:var(--text-sub);">稼働時間</div>
                    <div class="status-value" id="stat-uptime">0時間 0分</div>
                </div>
                <div class="status-item">
                    <div style="font-size:0.75rem; color:var(--text-sub);">応答速度 (Ping)</div>
                    <div class="status-value" id="stat-ping">0 ms</div>
                </div>
                <div class="status-item">
                    <div style="font-size:0.75rem; color:var(--text-sub);">NG検知数</div>
                    <div class="status-value" id="stat-ng">0 件</div>
                </div>
                <div class="status-item">
                    <div style="font-size:0.75rem; color:var(--text-sub);">登録迷言数</div>
                    <div class="status-value" id="stat-meigen">0 件</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">⚙️ 設定メニュー</div>
            <button onclick="switchTab('settings')" class="save-btn" style="background: var(--card-inner); border: 1px solid var(--border-color); color: var(--text-main);">
                詳細設定画面を開く ➔
            </button>
        </div>
    </div>

    <!-- ⚙️ 設定 タブ -->
    <div id="tab-settings" class="page-section">
        <form id="setting-form">
            <!-- 送信チャンネル設定 -->
            <div class="card">
                <div class="card-title">📫 機能＆送信チャンネル設定</div>
                
                <div class="form-group">
                    <label>💬 ようこそメッセージ本文 (`{user}` でメンション)</label>
                    <textarea id="welcome-msg" rows="2" placeholder="ようこそ {user} さん！"></textarea>
                </div>

                <div class="form-group">
                    <label>👋 ようこそメッセージ送信先</label>
                    <select id="welcome-ch" class="ch-select"><option value="0">（未設定 / 無効）</option></select>
                </div>

                <div class="form-group">
                    <label>🎉 レベルアップ通知先</label>
                    <select id="level-ch" class="ch-select"><option value="0">（未設定 / 無効）</option></select>
                </div>

                <div class="form-group">
                    <label>🚨 NGワード警報送信先</label>
                    <select id="security-ch" class="ch-select"><option value="0">（未設定 / 無効）</option></select>
                </div>

                <div class="form-group">
                    <label>🤪 迷言通知送信先</label>
                    <select id="meigen-ch" class="ch-select"><option value="0">（未設定 / 無効）</option></select>
                </div>
            </div>

            <!-- 🚫 NGワード設定 -->
            <div class="card">
                <div class="card-title">🚫 NGワード管理</div>
                <div class="form-group">
                    <label>対象の単語 (カンマ `,` 区切りで複数指定)</label>
                    <textarea id="ng-words" rows="3" placeholder="スパムテスト, 荒らし, ngword"></textarea>
                </div>
            </div>

            <!-- ⚡ スパム対策設定 -->
            <div class="card">
                <div class="card-title">⚡ スパムメッセージ対策</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>時間枠 (秒)</label>
                        <input type="number" id="spam-window-sec" value="5">
                    </div>
                    <div class="form-group">
                        <label>最大許容数</label>
                        <input type="number" id="spam-max-msgs" value="5">
                    </div>
                </div>
                <div class="form-group">
                    <label>1メッセージ内の最大メンション許容数</label>
                    <input type="number" id="spam-max-mentions" value="5">
                </div>
            </div>

            <!-- 📈 レベリング設定 -->
            <div class="card">
                <div class="card-title">📈 レベリング・EXP付与設定</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>最小付与EXP</label>
                        <input type="number" id="exp-min" value="10">
                    </div>
                    <div class="form-group">
                        <label>最大付与EXP</label>
                        <input type="number" id="exp-max" value="25">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>クールダウン (秒)</label>
                        <input type="number" id="exp-cooldown" value="60">
                    </div>
                    <div class="form-group">
                        <label>最小文字数</label>
                        <input type="number" id="exp-min-len" value="5">
                    </div>
                </div>
                <div class="form-group">
                    <label>VC通話 1分あたりの獲得EXP</label>
                    <input type="number" id="vc-exp" value="5">
                </div>
            </div>

            <button type="button" class="save-btn" id="save-settings">すべての設定を保存する</button>
        </form>
    </div>

    <!-- 📜 実行履歴 タブ -->
    <div id="tab-logs" class="page-section">
        <div class="card">
            <div class="card-title">📜 実行履歴</div>
            <p style="color: var(--text-sub); font-size: 0.85rem;">直近の自動処理履歴です。</p>
        </div>
    </div>
</div>

<script>
    function changeTheme(themeName) {
        document.documentElement.setAttribute('data-theme', themeName);
    }

    function switchTab(tabName) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        if (tabName === 'home') {
            document.getElementById('tab-home').classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else if (tabName === 'settings') {
            document.getElementById('tab-settings').classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
        } else if (tabName === 'logs') {
            document.getElementById('tab-logs').classList.add('active');
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
        }
    }

    async function fetchStatus() {
        try {
            const res = await fetch('/api/status');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('stat-uptime').innerText = data.uptime;
                document.getElementById('stat-ping').innerText = data.ping;
                document.getElementById('stat-ng').innerText = data.ng_count;
                document.getElementById('stat-meigen').innerText = data.meigen_count;
            }
        } catch (e) {
            console.error('ステータス取得失敗:', e);
        }
    }

    async function loadGuildChannels() {
        const guildId = document.getElementById('server-select').value;
        if (!guildId) return;

        try {
            const res = await fetch(`/api/channels?guild_id=${guildId}`);
            if (res.ok) {
                const data = await res.json();
                document.querySelectorAll('.ch-select').forEach(select => {
                    const currentVal = select.value;
                    select.innerHTML = '<option value="0">（未設定 / 無効）</option>';
                    data.channels.forEach(ch => {
                        const opt = document.createElement('option');
                        opt.value = ch.id;
                        opt.textContent = `# ${ch.name}`;
                        select.appendChild(opt);
                    });
                    select.value = currentVal;
                });
            }
        } catch (e) {
            console.error('チャンネル取得失敗:', e);
        }
    }

    async function loadCurrentSettings() {
        await loadGuildChannels();
        try {
            const res = await fetch('/api/settings');
            if (res.ok) {
                const data = await res.json();
                if (data.welcome_msg) document.getElementById('welcome-msg').value = data.welcome_msg;
                if (data.welcome_ch) document.getElementById('welcome-ch').value = data.welcome_ch;
                if (data.level_ch) document.getElementById('level-ch').value = data.level_ch;
                if (data.security_ch) document.getElementById('security-ch').value = data.security_ch;
                if (data.meigen_ch) document.getElementById('meigen-ch').value = data.meigen_ch;

                if (data.ng_words) document.getElementById('ng-words').value = data.ng_words;
                if (data.spam_window_sec) document.getElementById('spam-window-sec').value = data.spam_window_sec;
                if (data.spam_max_msgs) document.getElementById('spam-max-msgs').value = data.spam_max_msgs;
                if (data.spam_max_mentions) document.getElementById('spam-max-mentions').value = data.spam_max_mentions;

                if (data.exp_min) document.getElementById('exp-min').value = data.exp_min;
                if (data.exp_max) document.getElementById('exp-max').value = data.exp_max;
                if (data.exp_cooldown) document.getElementById('exp-cooldown').value = data.exp_cooldown;
                if (data.exp_min_len) document.getElementById('exp-min-len').value = data.exp_min_len;
                if (data.vc_exp) document.getElementById('vc-exp').value = data.vc_exp;
            }
        } catch (e) {
            console.error('設定の読み込み失敗:', e);
        }
    }

    document.getElementById('save-settings').addEventListener('click', async () => {
        const payload = {
            welcome_msg: document.getElementById('welcome-msg').value,
            welcome_ch: document.getElementById('welcome-ch').value,
            level_ch: document.getElementById('level-ch').value,
            security_ch: document.getElementById('security-ch').value,
            meigen_ch: document.getElementById('meigen-ch').value,
            
            ng_words: document.getElementById('ng-words').value,
            spam_window_sec: document.getElementById('spam-window-sec').value,
            spam_max_msgs: document.getElementById('spam-max-msgs').value,
            spam_max_mentions: document.getElementById('spam-max-mentions').value,
            
            exp_min: document.getElementById('exp-min').value,
            exp_max: document.getElementById('exp-max').value,
            exp_cooldown: document.getElementById('exp-cooldown').value,
            exp_min_len: document.getElementById('exp-min-len').value,
            vc_exp: document.getElementById('vc-exp').value
        };

        try {
            const res = await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('✅ すべての拡張設定を保存・反映しました！');
            } else {
                alert('❌ 設定の保存に失敗しました。');
            }
        } catch (e) {
            alert('❌ 通信エラーが発生しました。');
        }
    });

    fetchStatus();
    setInterval(fetchStatus, 5000);
    loadCurrentSettings();
</script>

</body>
</html>

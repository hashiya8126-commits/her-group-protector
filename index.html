<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HER Group Protector</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --card-inner: #24283b;
            --primary: #5865f2;
            --text-main: #ffffff;
            --text-sub: #949ba4;
            --border-color: #2b2f48;
            --accent-green: #2ecc71;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select, button, input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-inner);
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .status-badge {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--accent-green);
        }

        .menu-item {
            background: var(--card-inner);
            padding: 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .menu-item .desc {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-box {
            background: var(--card-inner);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .time-range {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .time-range input {
            width: 50%;
        }

        .save-btn {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        🛡️ HER Group Protector
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('home')">🏠 ホーム</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ 設定</button>
        <button class="tab-btn" onclick="switchTab('logs')">📜 実行履歴</button>
    </div>

    <!-- 共通：サーバー選択 -->
    <div class="card">
        <div class="card-title">🌐 管理するサーバーを選択</div>
        <select id="server-select">
            <!-- SERVER_OPTIONS -->
        </select>
        <div class="status-badge">
            🟢 Botオンライン (HER Group Protector BOT)
        </div>
    </div>

    <!-- 🏠 ホーム タブ -->
    <div id="tab-home" class="page-section active">
        <!-- ⚙️ 設定メニュー（システム状況の上に配置） -->
        <div class="card">
            <div class="card-title">⚙️ 設定メニュー</div>
            <div class="menu-item" onclick="switchTab('settings')">
                <div>
                    <div style="font-weight: bold; font-size: 0.95rem;">📫 ようこそメッセージ & ログ設定</div>
                    <div class="desc">新規参加者の歓迎メッセージや各種ログチャンネルの設定</div>
                </div>
                <div style="color: var(--primary); font-size: 1.2rem;">➔</div>
            </div>
        </div>

        <!-- 📊 システム稼働状況 (実数値連動) -->
        <div class="card">
            <div class="card-title">📊 システム稼働状況</div>
            <div class="grid-2">
                <div class="stat-box">
                    <div class="desc">連続稼働時間</div>
                    <div class="stat-value" id="val-uptime">取得中...</div>
                </div>
                <div class="stat-box">
                    <div class="desc">レイテンシー (Ping)</div>
                    <div class="stat-value" id="val-ping">取得中...</div>
                </div>
            </div>
            <div class="grid-2">
                <div class="stat-box">
                    <div class="desc">検出済み迷言</div>
                    <div class="stat-value" id="val-meigen">取得中...</div>
                </div>
                <div class="stat-box">
                    <div class="desc">NGワード自動処理</div>
                    <div class="stat-value" id="val-ng">取得中...</div>
                </div>
            </div>

            <div style="margin-top: 12px;">
                <div class="card-title" style="justify-content: space-between;">
                    <span>⚡ CPU使用率 (<span id="val-cpu">0%</span>)</span>
                    <span style="font-size:0.7rem; cursor:pointer; color:var(--primary);" id="change-speed">⏱️ 更新間隔: 1秒</span>
                </div>
                <canvas id="cpuChart" height="120"></canvas>
            </div>
        </div>
    </div>

    <!-- ⚙️ 設定 タブ -->
    <div id="tab-settings" class="page-section">
        <div class="card">
            <div class="card-title">📫 ようこそメッセージ & ログ設定</div>
            <form id="setting-form">
                <div class="form-group">
                    <label>💬 ようこそメッセージ本文</label>
                    <textarea id="welcome-msg" rows="3" placeholder="ようこそ {user} さん！"></textarea>
                </div>

                <div class="form-group">
                    <label>🔕 メンションのサイレント（@silent）設定</label>
                    <select id="silent-mode">
                        <option value="none">通常メンション（通知あり）</option>
                        <option value="always">常時サイレント（通知なし）</option>
                        <option value="schedule">時間帯で切り替え</option>
                    </select>

                    <div class="time-range" id="time-setting" style="display: none;">
                        <input type="time" id="silent-start" value="22:00">
                        <span>〜</span>
                        <input type="time" id="silent-end" value="07:00">
                    </div>
                </div>

                <div class="form-group">
                    <label>📜 編集・削除ログチャンネル</label>
                    <select class="channel-select" id="audit-ch">
                        <option value="">チャンネルを選択してください</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>🚨 NGワード警報チャンネル</label>
                    <select class="channel-select" id="security-ch">
                        <option value="">チャンネルを選択してください</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>🤪 迷言通知チャンネル</label>
                    <select class="channel-select" id="meigen-ch">
                        <option value="">チャンネルを選択してください</option>
                    </select>
                </div>

                <button type="button" class="save-btn" id="save-settings">設定を保存する</button>
            </form>
        </div>
    </div>

    <!-- 📜 実行履歴 タブ -->
    <div id="tab-logs" class="page-section">
        <div class="card">
            <div class="card-title">📜 実行履歴</div>
            <p style="color: var(--text-sub); font-size: 0.85rem;">直近の自動処理履歴です。</p>
        </div>
    </div>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        if (tabName === 'home') {
            document.getElementById('tab-home').classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else if (tabName === 'settings') {
            document.getElementById('tab-settings').classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
        } else if (tabName === 'logs') {
            document.getElementById('tab-logs').classList.add('active');
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
        }
    }

    // --- CPU グラフ描画 ---
    const ctx = document.getElementById('cpuChart').getContext('2d');
    const maxDataPoints = 15;
    let updateIntervalMs = 1000;

    const cpuChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array(maxDataPoints).fill(''),
            datasets: [{
                label: 'CPU %',
                data: Array(maxDataPoints).fill(0),
                borderColor: '#5865f2',
                backgroundColor: 'rgba(88, 101, 242, 0.15)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            animation: false,
            scales: {
                x: { display: false },
                y: { min: 0, max: 100, ticks: { color: '#949ba4', stepSize: 25 } }
            },
            plugins: { legend: { display: false } }
        }
    });

    let fetchTimer = null;

    async function fetchSystemStatus() {
        try {
            const res = await fetch('/api/status');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('val-uptime').innerText = data.uptime;
                document.getElementById('val-ping').innerText = data.ping;
                document.getElementById('val-meigen').innerText = data.meigen_count;
                document.getElementById('val-ng').innerText = data.ng_count;
                document.getElementById('val-cpu').innerText = data.cpu + '%';

                cpuChart.data.datasets[0].data.push(data.cpu);
                cpuChart.data.datasets[0].data.shift();
                cpuChart.update();
            }
        } catch (e) {
            console.error('ステータス取得失敗:', e);
        }
    }

    function startLoop() {
        if (fetchTimer) clearInterval(fetchTimer);
        fetchSystemStatus();
        fetchTimer = setInterval(fetchSystemStatus, updateIntervalMs);
    }

    const speedBtn = document.getElementById('change-speed');
    speedBtn.addEventListener('click', () => {
        if (updateIntervalMs === 1000) {
            updateIntervalMs = 3000;
            speedBtn.innerText = '⏱️ 更新間隔: 3秒';
        } else if (updateIntervalMs === 3000) {
            updateIntervalMs = 5000;
            speedBtn.innerText = '⏱️ 更新間隔: 5秒';
        } else {
            updateIntervalMs = 1000;
            speedBtn.innerText = '⏱️ 更新間隔: 1秒';
        }
        startLoop();
    });

    startLoop();

    // サイレント切り替え
    const silentMode = document.getElementById('silent-mode');
    const timeSetting = document.getElementById('time-setting');
    silentMode.addEventListener('change', () => {
        timeSetting.style.display = silentMode.value === 'schedule' ? 'flex' : 'none';
    });

    // 設定保存
    document.getElementById('save-settings').addEventListener('click', () => {
        alert('設定を保存しました！');
        document.getElementById('setting-form').reset();
        timeSetting.style.display = 'none';
    });
</script>

</body>
</html>
